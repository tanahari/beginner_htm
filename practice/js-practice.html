<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Javaスクリプトを動かしてみよう</title>
        <style>
            /* 簡単な見た目の調整（CSS）*/
            body { font-family: sans-serif; text-align: center; padding-top: 50px; }
            button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
            #message { font-size: 24px; color: #333; margin-bottom: 20px; }
        </style>
    </head>
    <body> <!-- 1. HTML要素の配置 -->
        <p id="message">ボタンを押すと、この文字が変わります</p>
        <button onclick="changeText()">文字を変える</button>
        <!-- 2. JavaScriptの記述 -->
        <script>
            // ボタンが押された時に実行される関数（命令セット）
            function changeText() {
                // ① HTMLの中から、idが"message"の要素を探して取得する
                const messageElement = document.getElementById("message");
                // ② 取得した要素のテキスト（中身）を新しい文字に書き換える。
                messageElement.textContent = "JavaScriptが成功しました！";
                // ③ 文字の色を赤色に変更する
                messageElement.style.color = "red";
            }
        </script>
    </body>
</html>
