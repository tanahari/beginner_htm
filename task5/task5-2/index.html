<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>関数の書き換え（アロー関数）</title>
    </head>
    <body>
        <button>ボタン</button>
        <script>
            const button = document.querySelector('button');

            button.addEventListener('click', () => {
                console.log('クリックしました')
            })
        </script>
    </body>
</html>
